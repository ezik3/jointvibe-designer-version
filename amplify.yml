version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g bun
        - bun install --frozen-lockfile
    build:
      commands:
        - bun run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - ~/.bun/**/*
